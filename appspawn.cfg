{
    "jobs" : [{
            "name" : "boot",
            "cmds" : [
                "mkdir /mnt/sandbox",
                "mkdir /mnt/sandbox/com.ohos.render/ 0711 nwebspawn nwebspawn",
                "mkdir /data/service/el1/startup/appspawn 0700 root root",
                "mkdir /data/service/el1/startup/cjappspawn 0700 root root",
                "mkdir /data/service/el1/startup/hybridspawn 0700 root root",
                "mkdir /data/service/el1/startup/nativespawn 0700 root root",
                "mkdir /data/service/el1/startup/nwebspawn/ 0700 nwebspawn nwebspawn",
                "mkdir /data/service/el1/startup/log 0755 root root"
            ]
        },
        {
            "name" : "init",
            "cmds" : [
                "mkdir /dev/pids",
                "mkdir /dev/pids/native",
                "mount cgroup none /dev/pids pids",
                "chown root appspawn /dev/pids",
                "chown root appspawn /dev/pids/tasks",
                "chown root appspawn /dev/pids/cgroup.procs",
                "chmod 0755 /dev/pids",
                "chmod 0755 /dev/pids/tasks",
                "chmod 0755 /dev/pids/cgroup.procs",
                "mkdir /dev/pids/appspawn_main",
                "mkdir /dev/pids/appspawn_spawned",
                "write /dev/pids/appspawn_spawned/pids.max max",
                "chown root appspawn /dev/pids/appspawn_main/cgroup.procs",
                "chmod 0664 /dev/pids/appspawn_main/cgroup.procs",
                "chown root appspawn /dev/pids/appspawn_main/pids.max",
                "chmod 0664 /dev/pids/appspawn_main/pids.max",
                "chown root appspawn /dev/pids/appspawn_spawned/cgroup.procs",
                "chmod 0664 /dev/pids/appspawn_spawned/cgroup.procs",
                "chown root appspawn /dev/pids/appspawn_spawned/pids.max",
                "chmod 0664 /dev/pids/appspawn_spawned/pids.max",
                "mkdir /dev/pids/nwebspawn_main",
                "mkdir /dev/pids/nwebspawn_spawned",
                "write /dev/pids/nwebspawn_spawned/pids.max max",
                "chown root nwebspawn /dev/pids/nwebspawn_main/cgroup.procs",
                "chmod 0664 /dev/pids/nwebspawn_main/cgroup.procs",
                "chown root nwebspawn /dev/pids/nwebspawn_main/pids.max",
                "chmod 0664 /dev/pids/nwebspawn_main/pids.max",
                "chown root nwebspawn /dev/pids/nwebspawn_spawned/cgroup.procs",
                "chmod 0664 /dev/pids/nwebspawn_spawned/cgroup.procs",
                "chown root nwebspawn /dev/pids/nwebspawn_spawned/pids.max",
                "chmod 0664 /dev/pids/nwebspawn_spawned/pids.max",
                "mkdir /dev/pids/nativespawn_main",
                "mkdir /dev/pids/nativespawn_spawned",
                "write /dev/pids/nativespawn_spawned/pids.max max",
                "chown root appspawn /dev/pids/nativespawn_main/cgroup.procs",
                "chmod 0664 /dev/pids/nativespawn_main/cgroup.procs",
                "chown root appspawn /dev/pids/nativespawn_main/pids.max",
                "chmod 0664 /dev/pids/nativespawn_main/pids.max",
                "chown root appspawn /dev/pids/nativespawn_spawned/cgroup.procs",
                "chmod 0664 /dev/pids/nativespawn_spawned/cgroup.procs",
                "chown root appspawn /dev/pids/nativespawn_spawned/pids.max",
                "chmod 0664 /dev/pids/nativespawn_spawned/pids.max",
                "mkdir /dev/pids/cjappspawn_main",
                "mkdir /dev/pids/cjappspawn_spawned",
                "write /dev/pids/cjappspawn_spawned/pids.max max",
                "chown root appspawn /dev/pids/cjappspawn_main/cgroup.procs",
                "chmod 0664 /dev/pids/cjappspawn_main/cgroup.procs",
                "chown root appspawn /dev/pids/cjappspawn_main/pids.max",
                "chmod 0664 /dev/pids/cjappspawn_main/pids.max",
                "chown root appspawn /dev/pids/cjappspawn_spawned/cgroup.procs",
                "chmod 0664 /dev/pids/cjappspawn_spawned/cgroup.procs",
                "chown root appspawn /dev/pids/cjappspawn_spawned/pids.max",
                "chmod 0664 /dev/pids/cjappspawn_spawned/pids.max",
                "mkdir /dev/pids/hybridspawn_main",
                "mkdir /dev/pids/hybridspawn_spawned",
                "write /dev/pids/hybridspawn_spawned/pids.max max",
                "chown root appspawn /dev/pids/hybridspawn_main/cgroup.procs",
                "chmod 0664 /dev/pids/hybridspawn_main/cgroup.procs",
                "chown root appspawn /dev/pids/hybridspawn_main/pids.max",
                "chmod 0664 /dev/pids/hybridspawn_main/pids.max",
                "chown root appspawn /dev/pids/hybridspawn_spawned/cgroup.procs",
                "chmod 0664 /dev/pids/hybridspawn_spawned/cgroup.procs",
                "chown root appspawn /dev/pids/hybridspawn_spawned/pids.max",
                "chmod 0664 /dev/pids/hybridspawn_spawned/pids.max"
            ]
        }
    ],
    "services" : [{
            "name" : "appspawn",
            "path" : ["/system/bin/appspawn",
                      "-mode appspawn",
                      "--process-name com.ohos.appspawn.startup --start-flags daemon --type standard ",
                      "--sandbox-switch on --bundle-name com.ohos.appspawn.startup --app-operate-type operate ",
                      "--render-command command --app-launch-type singleton --app-visible true"],
            "importance" : -20,
            "critical" : [1, 4, 240],
            "uid" : "root",
            "gid" : ["root"],
            "writepid" : ["/dev/memcg/perf_sensitive/cgroup.procs"],
            "setuid" : true,
            "cgroup" : true,
            "socket" : [{
                "name" : "AppSpawn",
                "family" : "AF_LOCAL",
                "type" : "SOCK_STREAM",
                "protocol" : "default",
                "permissions" : "0660",
                "uid" : "root",
                "gid" : "appspawn",
                "option" : [
                ]
            }],
            "sandbox" : 0,
            "start-mode" : "boot",
            "secon" : "u:r:appspawn:s0",
            "bootevents" : "bootevent.appspawn.started"
        }
    ]
}
